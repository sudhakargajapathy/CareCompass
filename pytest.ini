[pytest]
# Pytest configuration for CareCompass test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=agents
    --cov=utils
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml

# Markers for test organization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multi-component workflows
    slow: Tests that make real API calls (deselect with '-m "not slow"')
    smoke: Quick smoke tests for basic functionality
    real_vector_store: Opts out of the autouse cache stub (test drives a real
        ChromaDB against tmp_path). --strict-markers means this must be declared.

# Coverage configuration lives in .coveragerc (coverage.py does not read
# pytest.ini sections)
