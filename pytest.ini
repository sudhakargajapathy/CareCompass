[pytest]
# Pytest configuration for CareCompass test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=agents
    --cov=utils
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml

# Markers for test organization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multi-component workflows
    slow: Tests that make real API calls (deselect with '-m "not slow"')
    smoke: Quick smoke tests for basic functionality

# Coverage options
[coverage:run]
source = agents,utils
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */chroma_db/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Minimum coverage thresholds
fail_under = 80
